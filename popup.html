<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5V19L19 12L8 5Z" fill="currentColor"/>
        </svg>
      </div>
      <h1>Video Speed Controller</h1>
    </div>

    <div class="status" id="status">
      <div class="status-indicator" id="statusIndicator"></div>
      <span id="statusText">No videos detected</span>
    </div>

    <div class="current-speed">
      <span class="label">Current Speed:</span>
      <span class="speed-value" id="currentSpeed">1.0x</span>
    </div>

    <div class="speed-buttons">
      <button class="speed-btn" data-speed="0.25">0.25x</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="3">3x</button>
      <button class="speed-btn" data-speed="4">4x</button>
      <button class="speed-btn" data-speed="5">5x</button>
    </div>

    <div class="speed-slider">
      <label for="speedRange" class="slider-label">Custom Speed</label>
      <div class="slider-container">
        <span class="slider-min">0.25x</span>
        <input type="range" id="speedRange" min="0.25" max="5" step="0.25" value="1" class="slider">
        <span class="slider-max">5x</span>
      </div>
      <div class="slider-value" id="sliderValue">1.0x</div>
    </div>

    <div class="controls">
      <button class="control-btn" id="decreaseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 13H5V11H19V13Z" fill="currentColor"/>
        </svg>
        Slower
      </button>
      <button class="control-btn" id="resetBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12C4 16.4 7.6 20 12 20C16.4 20 20 16.4 20 12C20 7.6 16.4 4 12 4C10.3 4 8.7 4.6 7.4 5.7L9 7.3C9.9 6.5 11 6 12 6C15.3 6 18 8.7 18 12C18 15.3 15.3 18 12 18C8.7 18 6 15.3 6 12H8L5 9L2 12H4Z" fill="currentColor"/>
        </svg>
        Reset
      </button>
      <button class="control-btn" id="increaseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="currentColor"/>
        </svg>
        Faster
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
